<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16265c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- El diseño de la credencial —public/credencial.css— NO se carga acá.
       Está copiado tal cual del original aprobado, y ese original era una
       página suelta: nombra .card, .toolbar y @page sin acotar, porque en su
       hoja no había nada más. Cargándolo aquí le gana al sistema por venir
       después, y todas las tarjetas del programa pasan a medir 54 × 86 mm.
       Se pide desde app.js solo en las dos pantallas donde se dibuja la
       credencial, y se suelta al salir. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- El iPhone no recorta en círculo como Android, pero igual redondea las
       esquinas: va el emblema solo, sin el anillo de letras. -->
